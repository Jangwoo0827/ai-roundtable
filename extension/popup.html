<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>AI Roundtable</title>
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #12141a; color: #e6e8ee; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 4px; color: #9aa3b2; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 6px; border: 1px solid #2c313c; background: #1b1f27; color: inherit; font-family: ui-monospace, monospace; }
    button { margin-top: 10px; padding: 7px 10px; border: 0; border-radius: 6px; background: #5b8def; color: #fff; cursor: pointer; }
    button.ghost { background: #252a35; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .state { margin-top: 12px; padding: 8px; border-radius: 6px; background: #1b1f27; }
    ul { list-style: none; padding: 0; margin: 8px 0 0; }
    li { padding: 4px 0; border-top: 1px solid #252a35; }
    .muted { color: #9aa3b2; font-size: 12px; }
  </style>
</head>
<body>
  <h1>AI Roundtable Connector</h1>
  <label for="token">브리지 토큰 (npm run bridge 콘솔에 표시)</label>
  <input id="token" autocomplete="off" spellcheck="false" placeholder="32자리 토큰" />
  <label for="port">브리지 포트</label>
  <input id="port" type="number" value="8787" />
  <div class="row">
    <button id="save">저장 후 연결</button>
    <button id="refresh" class="ghost">상태 새로고침</button>
  </div>
  <div class="state" id="state">확인 중…</div>
  <ul id="sites"></ul>
  <div class="row">
    <button class="ghost" data-open="gemini">Gemini 열기</button>
    <button class="ghost" data-open="chatgpt">ChatGPT 열기</button>
    <button class="ghost" data-open="claude">Claude 열기</button>
  </div>
  <p class="muted">로그인은 각 사이트 탭에서 직접 하세요. 이 확장은 쿠키나 비밀번호를 읽지 않습니다.</p>
  <script src="popup.js"></script>
</body>
</html>
